version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
  bot:
    build: .
    depends_on:
      - redis
      - ollama
    env_file: .env
volumes:
  ollama: